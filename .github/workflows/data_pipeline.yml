name: Market and Macro Data Pipeline

on:
  workflow_dispatch:
  schedule:
    # Weekdays, after the US cash market close (UTC is fixed year-round).
    - cron: "30 22 * * 1-5"

permissions:
  contents: read

concurrency:
  group: market-data-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Sync index and ETF memberships
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIN_ADV_USD: "200000"
        run: python -m app.services.universe_manager
      - name: Run provider orchestration and Supabase upserts
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EDGAR_CONTACT_EMAIL: ${{ secrets.EDGAR_CONTACT_EMAIL }}
          UNIVERSE_CORE_LIMIT: "250"
          UNIVERSE_ROTATION_DAYS: "3"
          MIN_ADV_USD: "200000"
          YFINANCE_DAILY_LIMIT: "1800"
          FMP_DAILY_LIMIT: "250"
          TIINGO_HOURLY_LIMIT: "50"
          TIINGO_DAILY_LIMIT: "1000"
          FMP_DATA_LICENSE_CONFIRMED: ${{ vars.FMP_DATA_LICENSE_CONFIRMED || 'false' }}
          TIINGO_PERSISTENCE_ALLOWED: ${{ vars.TIINGO_PERSISTENCE_ALLOWED || 'false' }}
        run: python -m app.services.data_pipeline_orchestrator
